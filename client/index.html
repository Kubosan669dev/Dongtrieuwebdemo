<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Bộ biểu tượng sinh từ logo phường bằng `npm run make-favicon` -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e7c5e" />
    <!-- Ba thẻ dưới đây phải khớp với SITE_NAME / SITE_DESCRIPTION trong
         src/lib/site.js. Đây là bản trình thu thập KHÔNG chạy JavaScript đọc
         được (Facebook, Zalo), còn `Seo.jsx` chỉ ghi đè sau khi React chạy. -->
    <title>Phường Đông Triều — Quảng Ninh</title>
    <meta
      name="description"
      content="Cổng thông tin phường Đông Triều, tỉnh Quảng Ninh: tra cứu 11 khu phố sau sắp xếp, 13 cụm di tích đã xếp hạng, lịch lễ hội theo âm lịch, đặc sản, bản đồ số, dự báo thời tiết – triều cường và thông tin liên hệ của phường."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Phường Đông Triều — Quảng Ninh" />
    <meta
      property="og:description"
      content="Cổng thông tin phường Đông Triều: 11 khu phố sau sắp xếp, 13 cụm di tích nhà Trần, lễ hội theo âm lịch, đặc sản và bản đồ số."
    />
    <!-- Đường dẫn tương đối vì tên miền chưa cố định; khi triển khai thật nên
         đổi thành URL tuyệt đối theo PUBLIC_SITE_URL để Zalo/Facebook chắc chắn lấy được ảnh. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo phường Đông Triều, tỉnh Quảng Ninh" />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Đặt bảng màu trước khi trang vẽ lần đầu. Nếu đợi React chạy xong mới đặt
         thì khách chọn nền tối sẽ thấy loé một nhịp nền sáng mỗi lần tải trang.

         `__DT_THEMES__` do Vite thay lúc dựng, đọc thẳng từ src/lib/themes.js
         (xem plugin trong vite.config.js). Trước đây danh sách này được chép tay
         vào đây, nên thêm bảng màu thứ 9 mà quên sửa file HTML thì nó âm thầm
         rơi về 'heritage' ở lần tải đầu — không có lỗi nào báo.
         Mã màu thật nằm ở src/styles/themes.css. -->
    <script>
      (function () {
        try {
          var THEMES = __DT_THEMES__;
          var saved = localStorage.getItem('dt-theme');
          var theme = THEMES[saved] ? saved : 'heritage';
          // Bản trước lưu 'light'/'dark' vào chính khoá dt-theme
          var mode = saved === 'light' || saved === 'dark' ? saved : localStorage.getItem('dt-mode');
          if (mode !== 'light' && mode !== 'dark') mode = THEMES[theme];
          document.documentElement.dataset.theme = theme;
          if (mode === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage bị chặn — dùng bảng màu mặc định */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
